# Dependency policy, see docs/adr/0005-licensing.md. Run: cargo deny check
# Covers the workspace only; the board crates have their own lockfiles.

[licenses]
# Exactly the list in ADR 0005. Do not add a licence here without superseding the ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
]
confidence-threshold = 0.9
# ring 0.17 declares "Apache-2.0 AND ISC" in its manifest, so it needs no clarify entry.

[advisories]
# Yanked crates fail; unmaintained advisories on transitive crates are reported only.
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
