name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff-${{ matrix.os }}
          path: target/golden-diff/
      # The simulator window needs SDL2, so it is a non-default feature checked on Linux only.
      - name: Clippy for the simulator window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          cargo clippy -p embedded-browser-sim --features window -- -D warnings

  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lhns/design-skills
          ref: 61992a48751481ac2c0dfcc2b6b07ef1f94c7eaa
          path: design-skills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python design-skills/skills/tech-tree/scripts/check.py --config tech-tree.yaml

  changes:
    runs-on: ubuntu-latest
    outputs:
      cross: ${{ steps.filter.outputs.cross }}
      heap: ${{ steps.filter.outputs.heap }}
      s3: ${{ steps.filter.outputs.s3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cross:
              - 'crates/**'
              - 'boards/p4-*/**'
              - 'boards/patches/**'
              - 'docker/p4*'
              - 'scripts/build-firmware.sh'
              - 'scripts/size-*'
              - 'budget.toml'
              - '.github/workflows/ci.yml'
            heap:
              - 'crates/**'
              - 'testpages/**'
              - 'tools/measure/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            s3:
              - 'docker/s3*'
              - 'boards/s3-*/**'
              - 'scripts/qemu*'
              - '.github/workflows/ci.yml'

  # The corpus through the core API on 32-bit wasm under a capped heap: fails over the
  # P4 cap (12 MB); the S3 tier (4 MB) is reported only.
  heap-cap:
    needs: changes
    if: needs.changes.outputs.heap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and the wasm32-wasip1 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: cargo build -p measure --release --target wasm32-wasip1
      - run: cargo build -p measure --release
      - name: Heap cap
        shell: bash
        run: ./target/release/measure heap-cap --wasm target/wasm32-wasip1/release/measure.wasm --cap-mb 12 --s3-mb 4 | tee -a "$GITHUB_STEP_SUMMARY"

  # P4 firmware cross-build in the Docker image (ADR 0006) and the app image size gate.
  cross-p4:
    needs: changes
    if: needs.changes.outputs.cross == 'true'
    runs-on: ubuntu-latest
    # First run (cold caches): ~15 min, of which ~8 min image build and ~5 min cargo build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the image and the target dir
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/p4.Dockerfile
          tags: eb-p4-build:ci
          load: true
          cache-from: type=gha,scope=p4-image
          cache-to: type=gha,mode=max,scope=p4-image
      - uses: actions/cache@v4
        with:
          path: ~/eb-cache
          key: p4-cargo-${{ hashFiles('boards/p4-function-ev/Cargo.lock', 'docker/p4.Dockerfile') }}
          restore-keys: p4-cargo-
      - name: Build firmware
        run: |
          mkdir -p ~/eb-cache/registry ~/eb-cache/target
          docker run --rm -v "$PWD:/repo" -v ~/eb-cache/registry:/opt/rust/cargo/registry \
            -v ~/eb-cache/target:/tmp/eb-target -e OUT_DIR=/repo/out eb-p4-build:ci \
            bash /repo/scripts/build-firmware.sh
          sudo chown -R "$(id -u):$(id -g)" out ~/eb-cache
      - run: scripts/size-gate.sh p4-function-ev out/p4-function-ev-esp32p4/app.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-function-ev-firmware
          path: |
            out/*/app.bin
            out/*/bootloader.bin
            out/*/firmware.elf
            out/*/*.txt

  qemu-s3:
    needs: changes
    if: needs.changes.outputs.s3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/s3.Dockerfile
          tags: eb-s3:dev
          load: true
          cache-from: type=gha,scope=eb-s3
          cache-to: type=gha,scope=eb-s3,mode=max
      # ESP-IDF checkout/tools, cargo registry and target dir live in the container's /cache.
      - uses: actions/cache@v4
        with:
          path: .cache/eb-s3
          key: eb-s3-${{ hashFiles('boards/s3-qemu-test/Cargo.toml', 'boards/s3-qemu-test/Cargo.lock', 'boards/s3-qemu-test/sdkconfig.defaults', 'docker/s3.Dockerfile') }}
          restore-keys: eb-s3-
      - name: Build firmware, boot in QEMU, compare screenshot
        run: |
          mkdir -p .cache/eb-s3 && chmod 777 .cache/eb-s3
          sudo chown -R 1000:1000 .cache/eb-s3
          EB_S3_CACHE="$PWD/.cache/eb-s3" scripts/qemu-s3-screenshot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-s3
          path: |
            out/qemu-s3/screen.png
            out/qemu-s3/diff.png
            out/qemu-s3/serial.log
