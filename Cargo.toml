[workspace]
resolver = "3"
members = [
    "crates/embedded-browser",
    "crates/embedded-browser-assets",
    "crates/embedded-browser-sim",
    "tools/js-spike",
    "tools/measure",
]
exclude = ["boards/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lhns/embedded-browser"
